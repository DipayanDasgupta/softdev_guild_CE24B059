services:
  - type: web
    name: ipl-api
    env: python
    buildCommand: pip install -r ipl-api/requirements.txt
    startCommand: uvicorn ipl-api.api:app --host 0.0.0.0 --port $PORT
    rootDir: ipl-api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ipl-db
          property: connectionString
