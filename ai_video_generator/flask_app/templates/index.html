<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cricket Commentary Generator</title>
    <style>
        body { font-family: sans-serif; background-color: #1a202c; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #2d3748; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #63b3ed; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, select { width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #4a5568; background-color: #1a202c; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; border: none; border-radius: 4px; background-color: #4299e1; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #3182ce; }
        .search-results { border: 1px solid #4a5568; border-top: none; max-height: 200px; overflow-y: auto; background-color: #1a202c; }
        .result-item { padding: 0.75rem; cursor: pointer; }
        .result-item:hover { background-color: #4a5568; }
        #loading { display: none; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Cricket Commentary</h1>
        <form id="video-form" action="/generate" method="post" enctype="multipart/form-data">
            <!-- Player Search -->
            <div class="form-group">
                <label for="player-name">Player Name</label>
                <input type="text" id="player-name" name="player_name" placeholder="Start typing a player's name..." autocomplete="off" required>
                <input type="hidden" id="player-id" name="player_id">
                <div class="search-results" id="search-results"></div>
            </div>
            
            <div class="form-group">
                <label for="match-id">Match ID (optional)</label>
                <input type="text" id="match-id" name="match_id" placeholder="e.g., 335982">
            </div>

            <!-- Commentary Tone -->
            <div class="form-group">
                <label for="tone">Commentary Tone</label>
                <select id="tone" name="tone">
                    <option value="energetic" selected>Energetic</option>
                    <option value="analytical">Analytical</option>
                    <option value="dramatic">Dramatic</option>
                    <option value="humorous">Humorous</option>
                </select>
            </div>

            <!-- NEW: Custom Presenter Image Upload -->
            <div class="form-group">
                <label for="presenter_image">Custom Presenter Image (optional)</label>
                <input type="file" id="presenter_image" name="presenter_image" accept="image/jpeg, image/png">
            </div>

            <button type="submit">Generate Video</button>
        </form>
        <div id="loading">
            <p>Generating video... This may take a few minutes. Please wait.</p>
        </div>
    </div>

    <script>
        const playerNameInput = document.getElementById('player-name');
        const playerIdInput = document.getElementById('player-id');
        const searchResults = document.getElementById('search-results');
        const form = document.getElementById('video-form');
        const loadingDiv = document.getElementById('loading');
        let debounceTimer;

        // --- Real-time player search logic ---
        playerNameInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const query = playerNameInput.value;
            
            if (query.length < 2) {
                searchResults.innerHTML = '';
                return;
            }

            debounceTimer = setTimeout(() => {
                fetch(`http://127.0.0.1:8000/players/search?name=${query}`)
                    .then(response => response.json())
                    .then(data => {
                        searchResults.innerHTML = '';
                        if (data && data.length > 0) {
                            data.forEach(player => {
                                const item = document.createElement('div');
                                item.classList.add('result-item');
                                item.textContent = player.name;
                                item.dataset.id = player.id;
                                item.dataset.name = player.name;
                                searchResults.appendChild(item);
                            });
                        } else {
                            searchResults.innerHTML = '<div class="result-item">No players found</div>';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching players:', error);
                        searchResults.innerHTML = '<div class="result-item">API Error</div>';
                    });
            }, 300); // Debounce to avoid too many API calls
        });

        // --- Handle selection from search results ---
        searchResults.addEventListener('click', (e) => {
            if (e.target && e.target.classList.contains('result-item')) {
                const selectedId = e.target.dataset.id;
                const selectedName = e.target.dataset.name;
                
                if (selectedId) {
                    playerNameInput.value = selectedName;
                    playerIdInput.value = selectedId;
                    searchResults.innerHTML = '';
                }
            }
        });

        // --- Show loading message on submit ---
        form.addEventListener('submit', () => {
            if (playerIdInput.value) { // Only submit if a valid player ID is set
                loadingDiv.style.display = 'block';
                form.style.display = 'none';
            } else {
                alert("Please select a valid player from the search results.");
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
