<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cricket Commentary Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 50;
        }
        .modal-content {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            margin: 15% auto;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .search-results {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .search-results div {
            padding: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .search-results div:hover {
            background-color: #3b82f6;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center text-white font-sans">
    <div class="bg-gradient-to-br from-gray-800 to-gray-900 p-6 rounded-xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-400">AI Cricket Commentary</h1>
        <form id="generateForm" action="/generate" method="post" enctype="multipart/form-data" class="space-y-4">
            <div class="relative">
                <button type="button" id="searchButton" class="absolute right-2 top-2 text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </button>
                <input type="number" id="player_id" name="player_id" placeholder="Player ID (e.g., 2)" required
                       class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-gray-400">
            </div>
            <input type="number" id="match_id" name="match_id" placeholder="Match ID (optional)"
                   class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white placeholder-gray-400">
            <select id="tone" name="tone" class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
                <option value="energetic" class="bg-gray-700">Energetic</option>
                <option value="analytical" class="bg-gray-700">Analytical</option>
                <option value="humorous" class="bg-gray-700">Humorous</option>
            </select>
            <label class="block text-sm font-medium text-gray-300">Custom Presenter Image (optional)</label>
            <input type="file" id="presenter" name="presenter" accept="image/jpeg,image/png"
                   class="w-full p-3 bg-gray-700 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-white">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-semibold transition duration-300 ease-in-out transform hover:scale-105">
                Generate Video
            </button>
        </form>
        <p id="status" class="text-center mt-4 text-gray-400"></p>
    </div>

    <!-- Modal for Player Search -->
    <div id="searchModal" class="modal">
        <div class="modal-content">
            <h2 class="text-xl font-bold mb-4">Search Cricketer</h2>
            <input type="text" id="searchInput" placeholder="Enter player name..."
                   class="w-full p-2 mb-2 bg-gray-800 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div id="searchResults" class="search-results"></div>
            <button id="closeModal" class="mt-4 w-full bg-red-600 hover:bg-red-700 text-white p-2 rounded-lg">
                Close
            </button>
        </div>
    </div>

    <script>
        // Modal and Search Functionality
        const searchButton = document.getElementById('searchButton');
        const searchModal = document.getElementById('searchModal');
        const closeModal = document.getElementById('closeModal');
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const playerIdInput = document.getElementById('player_id');
        const status = document.getElementById('status');
        const form = document.getElementById('generateForm');

        searchButton.addEventListener('click', () => {
            searchModal.style.display = 'block';
            searchInput.focus();
        });

        closeModal.addEventListener('click', () => {
            searchModal.style.display = 'none';
            searchResults.innerHTML = '';
        });

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 2) {
                searchResults.innerHTML = '';
                return;
            }
            try {
                const response = await fetch(`${process.env.API_BASE_URL}/players/search?name=${encodeURIComponent(query)}`);
                if (!response.ok) throw new Error('Search failed');
                const players = await response.json();
                searchResults.innerHTML = players.map(player => `
                    <div class="fade-in" onclick="selectPlayer(${player.id}, '${player.name}')">${player.name}</div>
                `).join('');
            } catch (error) {
                searchResults.innerHTML = '<div class="text-red-400">Error loading players</div>';
                console.error('Search error:', error);
            }
        });

        function selectPlayer(id, name) {
            playerIdInput.value = id;
            status.textContent = `Selected: ${name} (ID: ${id})`;
            searchModal.style.display = 'none';
            searchResults.innerHTML = '';
        }

        form.addEventListener('submit', () => {
            status.textContent = 'Generating video...';
            setTimeout(() => status.textContent = '', 5000); // Clear after 5s
        });

        // Close modal on outside click
        window.addEventListener('click', (e) => {
            if (e.target === searchModal) {
                searchModal.style.display = 'none';
                searchResults.innerHTML = '';
            }
        });
    </script>
</body>
</html>
