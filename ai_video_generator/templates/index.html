<!-- ai_video_generator/templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Cricket Commentary Generator</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, select, button { padding: 10px; font-size: 16px; }
        label { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Generate AI Cricket Commentary</h1>
    <form action="/generate" method="post" enctype="multipart/form-data">
        <label for="player_id">Player ID:</label>
        <input type="number" id="player_id" name="player_id" placeholder="e.g., 2" required>
        
        <label for="match_id">Match ID (optional):</label>
        <input type="number" id="match_id" name="match_id" placeholder="e.g., 1">
        
        <label for="tone">Commentary Tone:</label>
        <select id="tone" name="tone">
            <option value="energetic">Energetic</option>
            <option value="analytical">Analytical</option>
            <option value="humorous">Humorous</option>
        </select>
        
        <label for="presenter">Custom Presenter Image (optional):</label>
        <input type="file" id="presenter" name="presenter" accept="image/jpeg,image/png">
        
        <button type="submit">Generate Video</button>
    </form>
</body>
</html>
